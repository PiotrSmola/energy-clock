{% if field.field.widget.input_type == "checkbox" %}
<div class="field field--check{% if field.errors %} field--invalid{% endif %}">
  <label class="check" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
{% else %}
<div class="field{% if field.errors %} field--invalid{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if hint %}<p class="hint">{{ hint }}</p>{% elif field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
{% endif %}
